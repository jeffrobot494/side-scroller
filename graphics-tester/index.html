<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphics Tester</title>
  <!-- server.mjs serves /graphics-tester (no slash) without redirecting, which
       would resolve ./app.js against the site root. -->
  <script>
    if (!location.pathname.endsWith("/") && !location.pathname.endsWith(".html"))
      location.replace(location.pathname + "/" + location.search + location.hash);
  </script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <style>
    :root {
      --bg: #0b1018; --panel: #121a26; --line: #223047; --text: #cfdbe9;
      --dim: #7d8ea6; --accent: #6fd3ff; --on: #1d3a52;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 260px 1fr; }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 12px; letter-spacing: .04em; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
      margin: 16px 0 6px; font-weight: 600; }
    .list button { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
      color: var(--text); padding: 5px 8px; border-radius: 4px; cursor: pointer; font: inherit; }
    .list button:hover:not(:disabled) { border-color: var(--line); }
    .list button.on { background: var(--on); border-color: var(--accent); }
    .list button:disabled { color: var(--dim); cursor: default; }
    .list small { color: var(--dim); float: right; }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
    label.row input[type=range] { width: 110px; }
    .empty { color: var(--dim); font-style: italic; padding: 4px 8px; }
    main { position: relative; overflow: hidden; }
    #view { display: block; width: 100%; height: 100%; }
    #status { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; font: 12px ui-monospace, monospace;
      color: var(--dim); background: linear-gradient(transparent, #0008); pointer-events: none; display: flex; gap: 18px; }
    /* Worm timeline: play/pause, scrub, time and phase. */
    #scrub { position: absolute; left: 12px; bottom: 30px; display: none; align-items: center; gap: 8px;
      font: 11px ui-monospace, monospace; color: var(--dim); background: #0009; padding: 3px 8px; border-radius: 4px; }
    #scrub button { background: none; border: none; color: var(--text); cursor: pointer; font: 11px ui-monospace, monospace; padding: 0 2px; width: 14px; }
    #scrub input { width: 220px; height: 12px; margin: 0; }
    #scrub span { min-width: 120px; color: var(--text); }
    #err { position: absolute; top: 12px; left: 12px; color: #ff9a8a; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <aside>
    <h1>GRAPHICS TESTER</h1>

    <h2>Pages</h2>
    <div class="list"><button onclick="location.href='./splash.html'">Start screen ↗</button></div>

    <h2>Subject</h2>
    <div class="list" id="subjects"></div>

    <h2>Animation</h2>
    <div class="list" id="anims"></div>
    <label class="row">Facing left <input type="checkbox" id="facing"></label>
    <label class="row">Game model beside it <input type="checkbox" id="compare"></label>
    <label class="row">Speed <input type="range" id="speed" min="0" max="2" step="0.05" value="1"></label>

    <h2>Scene</h2>
    <div class="list" id="scenes"></div>

    <h2>Look</h2>
    <label class="row">Bloom <input type="range" id="bloom" min="0" max="2" step="0.05" value="0.7"></label>
    <label class="row">Exposure <input type="range" id="exposure" min="0.3" max="2.5" step="0.05" value="1.1"></label>
    <label class="row">Fog <input type="checkbox" id="fog" checked></label>

    <h2>Camera</h2>
    <div class="list" id="cams"></div>

    <h2>Experiments</h2>
    <div class="list" id="experiments"></div>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div id="scrub"><button id="play" title="Play / pause">❚❚</button><input type="range" id="time" min="0" max="1" step="0.01" value="0"><span id="clock"></span></div>
    <div id="status"></div>
    <div id="err"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
