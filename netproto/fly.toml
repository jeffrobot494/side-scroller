# ---------------------------------------------------------------------------
# Fly.io deployment, for comparison against Railway.
#
#     cd netproto && fly launch --no-deploy --copy-config --name <yours>
#     fly deploy
#
# dfw is Dallas — ~300km from Austin, against Railway's Ashburn at ~2,000km.
# If the paths are healthy the difference should be roughly 10ms against 40ms,
# and the run against Railway measured 281ms, so this is also a test of whether
# a provider's edge is the problem rather than distance.
# ---------------------------------------------------------------------------

app = "fly-netproto-test"
primary_region = "dfw"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # A latency test must never measure a cold start. Machines that stop between
  # sessions would put a multi-second wake in the first sample of every run.
  auto_stop_machines = "off"
  auto_start_machines = true

  # ZERO, and it must stay zero. The world lives in this process's memory, so a
  # second machine is a second arena: two players would be balanced onto
  # different hosts, see empty rooms, and never meet. The first deploy created
  # an HA pair for exactly this reason and it had to be scaled back down.
  #
  # auto_stop_machines = "off" is what keeps the ONE machine alive; this line
  # only stops Fly adding a spare. A server-authoritative game cannot be scaled
  # horizontally without sticky routing or shared state, and that is a property
  # of the architecture rather than of this config.
  min_machines_running = 0

  # WebSockets are long-lived and mostly server->client at 20Hz; nothing here
  # should be treated as an idle connection.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
