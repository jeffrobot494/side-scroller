<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Behavior Lab — mockup</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c2027; --line: #2b313b;
    --ink: #dfe4ea; --ink-2: #8b95a3; --accent: #6f9ceb;
    --node: #4fb783; --path: #efc86b; --agent: #6fcf97; --goal: #e07a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  .lab { display: flex; flex-direction: column; height: 100vh; }

  .bar {
    display: flex; align-items: center; gap: 18px;
    padding: 0 14px; height: 46px; flex: none;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .bar .back {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  .bar h1 { font-size: 13.5px; font-weight: 600; margin: 0; }
  .grp { display: flex; align-items: center; gap: 10px; }
  .grp > .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-2);
  }
  label.chk { display: flex; align-items: center; gap: 5px; color: var(--ink-2); cursor: pointer; }
  label.chk input { accent-color: var(--accent); margin: 0; }
  label.chk.on { color: var(--ink); }
  .slider { display: flex; align-items: center; gap: 7px; }
  .slider input { width: 92px; accent-color: var(--accent); }
  .slider .val {
    color: var(--ink); font-variant-numeric: tabular-nums;
    min-width: 34px; text-align: right; font-size: 12px;
  }
  .spacer { flex: 1; }
  .hint { color: var(--ink-2); font-size: 11.5px; }

  .arena { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
  .arena svg { display: block; width: 100%; height: 100%; }

  .legend {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(28,32,39,.9); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 11px; font-size: 11px; color: var(--ink-2);
  }
  .legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
</style>
</head>
<body>
<div class="lab">

  <div class="bar">
    <button class="back">← Tools</button>
    <h1>Behavior Lab</h1>

    <div class="grp">
      <span class="lbl">Overlays</span>
      <label class="chk on"><input type="checkbox" checked> Graph</label>
      <label class="chk on"><input type="checkbox" checked> Path</label>
    </div>

    <div class="grp">
      <span class="lbl">Jump</span>
      <span class="slider"><input type="range" min="300" max="1100" value="720"><span class="val">720</span></span>
    </div>

    <div class="grp">
      <span class="lbl">Run</span>
      <span class="slider"><input type="range" min="120" max="700" value="320"><span class="val">320</span></span>
    </div>

    <span class="spacer"></span>
    <span class="hint">Click the level to set a goal · reload for a new level</span>
  </div>

  <div class="arena">
    <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid slice">

      <!-- terrain -->
      <g fill="#262b33" stroke="#333a45">
        <rect x="0" y="470" width="1200" height="90"/>
        <rect x="250" y="392" width="120" height="78"/>
        <rect x="470" y="330" width="180" height="18"/>
        <rect x="760" y="392" width="150" height="18"/>
        <rect x="330" y="230" width="150" height="18"/>
        <rect x="880" y="268" width="190" height="18"/>
        <rect x="620" y="180" width="130" height="18"/>
      </g>

      <!-- nav graph: nodes -->
      <g stroke="var(--node)" stroke-width="4" opacity=".85">
        <line x1="8"   y1="468" x2="248"  y2="468"/>
        <line x1="372" y1="468" x2="1192" y2="468"/>
        <line x1="252" y1="390" x2="368"  y2="390"/>
        <line x1="472" y1="328" x2="648"  y2="328"/>
        <line x1="762" y1="390" x2="908"  y2="390"/>
        <line x1="332" y1="228" x2="478"  y2="228"/>
        <line x1="882" y1="266" x2="1068" y2="266"/>
        <line x1="622" y1="178" x2="748"  y2="178"/>
      </g>

      <!-- nav graph: edges -->
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--node)"/>
        </marker>
      </defs>
      <g stroke="var(--node)" stroke-width="1.2" opacity=".4" fill="none"
         marker-start="url(#a)" marker-end="url(#a)">
        <line x1="230" y1="466" x2="262" y2="394"/>
        <line x1="356" y1="394" x2="392" y2="466"/>
        <line x1="360" y1="388" x2="470" y2="332"/>
        <line x1="470" y1="326" x2="360" y2="232"/>
        <line x1="640" y1="326" x2="756" y2="392"/>
        <line x1="640" y1="324" x2="628" y2="182"/>
        <line x1="900" y1="388" x2="890" y2="270"/>
        <line x1="905" y1="392" x2="960" y2="466"/>
        <line x1="745" y1="182" x2="884" y2="268"/>
      </g>
      <!-- one-way drop -->
      <g stroke="var(--node)" stroke-width="1.2" opacity=".4" stroke-dasharray="4 3" marker-end="url(#a)">
        <line x1="1060" y1="270" x2="1120" y2="464"/>
      </g>

      <!-- chosen path -->
      <g stroke="var(--path)" stroke-width="3" fill="none" stroke-linecap="round">
        <line x1="150" y1="462" x2="232" y2="462"/>
        <path d="M232,462 Q250,410 264,392"/>
        <line x1="264" y1="386" x2="356" y2="386"/>
        <path d="M356,386 Q420,330 470,328"/>
        <line x1="470" y1="322" x2="636" y2="322"/>
        <path d="M636,322 Q630,240 628,182"/>
        <line x1="628" y1="176" x2="700" y2="176"/>
      </g>

      <!-- agent -->
      <g transform="translate(150,462)">
        <rect x="-9" y="-42" width="18" height="30" rx="3" fill="var(--agent)"/>
        <circle cx="0" cy="-48" r="7" fill="var(--agent)"/>
        <rect x="-11" y="-12" width="7" height="12" rx="2" fill="var(--agent)"/>
        <rect x="4" y="-12" width="7" height="12" rx="2" fill="var(--agent)"/>
        <rect x="7" y="-36" width="20" height="4" rx="1.5" fill="#3f7a5c"/>
      </g>

      <!-- goal -->
      <g transform="translate(700,176)">
        <circle r="11" fill="none" stroke="var(--goal)" stroke-width="2"/>
        <circle r="3" fill="var(--goal)"/>
        <line x1="-17" y1="0" x2="-13" y2="0" stroke="var(--goal)" stroke-width="2"/>
        <line x1="13" y1="0" x2="17" y2="0" stroke="var(--goal)" stroke-width="2"/>
        <line x1="0" y1="-17" x2="0" y2="-13" stroke="var(--goal)" stroke-width="2"/>
        <line x1="0" y1="13" x2="0" y2="17" stroke="var(--goal)" stroke-width="2"/>
      </g>
    </svg>

    <div class="legend">
      <div><i style="color:var(--node)"></i> nav graph — nodes and moves</div>
      <div><i style="color:var(--path)"></i> chosen path</div>
      <div><i style="color:var(--goal);border-top-style:dashed"></i> clicked goal</div>
    </div>
  </div>

</div>
</body>
</html>
