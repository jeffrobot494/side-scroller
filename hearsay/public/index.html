<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hearsay</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel2:#171b21; --line:#232833;
    --fg:#e6e9ef; --dim:#8b94a5; --dimmer:#5d6675;
    --accent:#7dd3fc; --warm:#fbbf24; --bad:#f87171; --good:#4ade80; --violet:#c4b5fd;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:18px;padding:11px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px;cursor:pointer}
  h1 em{color:var(--dimmer);font-weight:400;font-style:normal;margin-left:8px;font-size:12px}
  nav{display:flex;gap:4px}
  nav a{padding:6px 13px;border-radius:7px;color:var(--dim);cursor:pointer;font-size:13px}
  nav a:hover{background:var(--panel2);color:var(--fg)}
  nav a.on{background:#12242f;color:var(--accent)}
  .pills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .pill{font:10.5px/1 var(--mono);padding:5px 9px;border-radius:99px;
        background:var(--panel2);border:1px solid var(--line);color:var(--dimmer)}
  .pill b{color:var(--accent);font-weight:500}
  .pill.warn b{color:var(--warm)}

  main{flex:1;min-height:0;display:none}
  main.on{display:grid}
  #vView{grid-template-columns:1fr 400px}
  #cView{grid-template-columns:280px 1fr 360px}
  #dView{grid-template-columns:340px 1fr}
  section{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  section:last-child{border-right:none}
  .head{padding:10px 15px;border-bottom:1px solid var(--line);flex:none;
        font:10.5px/1 var(--mono);letter-spacing:1px;text-transform:uppercase;
        color:var(--dimmer);display:flex;align-items:center;gap:9px}
  .head .n{margin-left:auto;text-transform:none;letter-spacing:0}
  .body{flex:1;overflow-y:auto;padding:15px}
  .foot{flex:none;padding:11px 13px;border-top:1px solid var(--line)}

  button{background:var(--accent);color:#06121b;border:0;border-radius:7px;
         padding:8px 15px;font:600 13px inherit;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4;cursor:default;filter:none}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  button.sm{padding:5px 10px;font-size:12px}
  input,textarea,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:8px 10px;font:13px inherit;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  label.f{display:block;margin-bottom:9px}
  label.f span{display:block;font:10.5px var(--mono);color:var(--dimmer);
               letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px}

  /* ---------------- village ---------------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--panel);
        padding:15px 12px;text-align:center;cursor:pointer;transition:.14s;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card svg{display:block;margin:0 auto 9px}
  .card .nm{font-weight:600;font-size:14px}
  .card .rl{color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.35}
  .card .lo{color:var(--dimmer);font-size:10.5px;margin-top:5px;font-family:var(--mono)}
  .badge{position:absolute;top:9px;right:9px;font:10px/1 var(--mono);
         padding:4px 7px;border-radius:99px;background:var(--panel2);
         border:1px solid var(--line);color:var(--dimmer)}
  .badge.hot{background:var(--accent);color:#06121b;border-color:var(--accent);font-weight:700}
  .badge.zero{color:#6b7280}

  /* ---------------- news feed ---------------- */
  .feed .item{border:1px solid var(--line);border-radius:10px;background:var(--panel);
              padding:11px 12px;margin-bottom:9px}
  .feed .item.new{border-color:var(--accent);background:#0e1a22}
  .feed .when{font:10px var(--mono);color:var(--dimmer);letter-spacing:.5px;
              text-transform:uppercase;margin-bottom:5px;display:flex;gap:8px}
  .feed .when .k{margin-left:auto;color:var(--violet)}
  .feed .tx{font-size:12.5px;line-height:1.5}
  .feed .sm{font-size:11.5px;color:var(--accent);margin-top:7px;font-style:italic;line-height:1.45}
  .feed .kb{font:10px var(--mono);color:var(--dimmer);margin-top:6px}

  .trace{border-top:1px solid var(--line);max-height:300px;overflow-y:auto;
         padding:12px 14px;font:11.5px/1.6 var(--mono);flex:none}
  .status{color:var(--warm);white-space:pre-wrap;margin-bottom:8px}
  .think{color:#94a3b8;white-space:pre-wrap;border-left:2px solid #2b3444;padding-left:11px}
  .think::before{content:"grok-4.6 reasoning";display:block;color:var(--violet);
                 font-size:9.5px;letter-spacing:1px;margin-bottom:5px}
  .err{color:var(--bad);white-space:pre-wrap}

  /* ---------------- conversation ---------------- */
  .face{padding:22px 16px;text-align:center;border-bottom:1px solid var(--line);flex:none}
  .face .nm{font-weight:650;font-size:17px;margin-top:11px}
  .face .rl{color:var(--dim);font-size:12.5px;margin-top:3px}
  .face .lo{color:var(--dimmer);font-size:11px;margin-top:7px;font-family:var(--mono)}
  .persona{padding:14px 16px;color:var(--dimmer);font-size:12px;font-style:italic;line-height:1.6}

  .log{flex:1;overflow-y:auto;padding:16px}
  .msg{margin-bottom:13px;max-width:74%}
  .msg.me{margin-left:auto}
  .msg .who{font:9.5px var(--mono);color:var(--dimmer);letter-spacing:.9px;
            text-transform:uppercase;margin-bottom:4px}
  .msg.me .who{text-align:right}
  .msg .txt{background:var(--panel);border:1px solid var(--line);
            border-radius:11px;padding:10px 13px;font-size:13.5px;line-height:1.55}
  .msg.me .txt{background:#102029;border-color:#1d3040}
  .meta{font:9.5px var(--mono);color:var(--dimmer);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .meta .lat{color:var(--good)}
  .composer{display:flex;gap:8px}

  .kn{border:1px solid var(--line);border-radius:10px;background:var(--panel);
      padding:11px 12px;margin-bottom:9px}
  .kn.used{border-color:var(--accent);background:#0e1a22}
  .kn .tx{font-size:12.5px;line-height:1.5}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .tag{font:9.5px/1 var(--mono);padding:3px 6px;border-radius:4px;
       background:#1b2029;color:var(--dimmer);border:1px solid var(--line)}
  .tag.route{color:var(--accent)}
  .tag.d{color:var(--warm)}
  .why{font-size:11px;color:var(--dimmer);font-style:italic;margin-top:6px;line-height:1.5}
  .why b{color:var(--violet);font-style:normal;font-weight:500;
         font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;
         display:block;margin-bottom:3px;text-transform:uppercase}

  .empty{color:var(--dimmer);font-style:italic;padding:26px 6px;text-align:center}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .agentrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
            border-radius:9px;background:var(--panel);padding:9px 11px;margin-bottom:7px;cursor:pointer}
  .agentrow.sel{border-color:var(--accent);background:#0f1720}
  .agentrow .nm{font-weight:600;font-size:13px}
  .agentrow .rl{color:var(--dim);font-size:11px}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#222833;border-radius:9px}
</style>
</head>
<body>

<header>
  <h1 onclick="go('village')">Hearsay <em>NPC knowledge, as a service</em></h1>
  <nav>
    <a id="nv" onclick="go('village')">Village</a>
    <a id="nd" onclick="go('dash')">Dashboard</a>
  </nav>
  <div class="pills" id="pills"></div>
</header>

<!-- ============================ VILLAGE ============================ -->
<main id="vView">
  <section>
    <div class="head">The village <span class="n" id="vCount"></span></div>
    <div class="body"><div class="grid" id="vGrid"></div></div>
  </section>
  <section>
    <div class="head">News feed <span class="n" id="fRemain"></span></div>
    <div class="body feed" id="vFeed"></div>
    <div class="trace" id="vTrace" style="display:none"></div>
    <div class="foot row">
      <button id="tick">Advance the day ▸</button>
      <select id="eff" style="width:auto"><option>low</option><option>medium</option><option selected>high</option><option>xhigh</option></select>
      <button class="ghost sm" onclick="resetWorld()">Reset</button>
    </div>
  </section>
</main>

<!-- ========================== CONVERSATION ========================== -->
<main id="cView">
  <section>
    <div class="face" id="cFace"></div>
    <div class="persona" id="cPersona"></div>
    <div class="foot"><button class="ghost" style="width:100%" onclick="go('village')">← Back to village</button></div>
  </section>
  <section>
    <div class="head">Conversation <span class="n" id="cModel"></span></div>
    <div class="log" id="cLog"></div>
    <div class="foot composer">
      <input id="cq" placeholder="Say something…" />
      <button onclick="say()">Send</button>
    </div>
  </section>
  <section>
    <div class="head">What they know <span class="n" id="cKnowN"></span></div>
    <div class="body" id="cKnow"></div>
  </section>
</main>

<!-- ============================ DASHBOARD ============================ -->
<main id="dView">
  <section>
    <div class="head">New NPC</div>
    <div class="body">
      <label class="f"><span>Name</span><input id="dName" placeholder="Gerta" /></label>
      <label class="f"><span>Role</span><input id="dRole" placeholder="the miller" /></label>
      <label class="f"><span>Location</span><input id="dLoc" placeholder="the mill" /></label>
      <label class="f"><span>Persona</span><textarea id="dPers" placeholder="Blunt. Counts everything twice."></textarea></label>
      <label class="f"><span>Knows (one per line)</span><textarea id="dKnows" placeholder="The mill wheel has been slipping since spring."></textarea></label>
      <label class="f"><span>Must never know (one per line)</span><textarea id="dForb"></textarea></label>
      <button style="width:100%" onclick="createAgent()">Create NPC</button>
    </div>
  </section>
  <section>
    <div class="head">Roster <span class="n" id="dCount"></span></div>
    <div class="body">
      <div id="dList"></div>
      <div id="dDetail"></div>
    </div>
  </section>
</main>

<script>
let AGENTS = [], FEED = [], SEL = null, VIEW = 'village', LASTHITS = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- procedural portraits ----------------
   No image generation and no asset pipeline: a deterministic SVG per name.
   Same name always yields the same face, which is all the demo needs.        */
const SKIN = ['#e8c39e','#d9a878','#c68a5f','#a9714a','#8a5a3b','#f0d3b5'];
const HAIR = ['#2b2118','#4a3423','#6b4a2c','#8c6239','#b0893f','#5a5550','#7a3f2e'];
const CLOTH = ['#3b4a5a','#4a3f5a','#3f5a4a','#5a4a3b','#5a3b47','#2f4858'];

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}

function portrait(name, size = 76) {
  const h = hash(name);
  const skin = SKIN[h % SKIN.length];
  const hair = HAIR[(h >> 3) % HAIR.length];
  const cloth = CLOTH[(h >> 6) % CLOTH.length];
  const style = (h >> 9) % 4;        // hair shape
  const brow  = (h >> 12) % 3;
  const mouth = (h >> 15) % 3;
  const s = size / 100;

  const hairPath = [
    'M22,42 C22,14 78,14 78,42 C78,30 68,22 50,22 C32,22 22,30 22,42 Z',      // short
    'M20,46 C20,12 80,12 80,46 L80,64 L72,64 L72,38 C60,30 40,30 28,38 L28,64 L20,64 Z', // long
    'M23,40 C25,16 75,16 77,40 C74,26 62,20 50,20 C38,20 26,26 23,40 Z M24,40 L20,58 L27,56 Z', // wisps
    'M50,16 C68,16 79,28 78,44 C76,32 66,26 50,26 C34,26 24,32 22,44 C21,28 32,16 50,16 Z',
  ][style];

  const mouthPath = [
    'M42,70 Q50,75 58,70',   // smile
    'M42,71 L58,71',         // flat
    'M42,73 Q50,68 58,73',   // frown
  ][mouth];

  const browY = [50, 48, 52][brow];

  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="49" fill="#0f1319" stroke="#232833"/>
    <path d="M18,100 C18,80 32,72 50,72 C68,72 82,80 82,100 Z" fill="${cloth}"/>
    <ellipse cx="50" cy="52" rx="25" ry="29" fill="${skin}"/>
    <ellipse cx="41" cy="${browY + 6}" rx="3.4" ry="${2.6 * (1 + (h % 2) * .3)}" fill="#1b1410"/>
    <ellipse cx="59" cy="${browY + 6}" rx="3.4" ry="${2.6 * (1 + (h % 2) * .3)}" fill="#1b1410"/>
    <path d="M36,${browY} Q41,${browY - 3} 46,${browY}" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M54,${browY} Q59,${browY - 3} 64,${browY}" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M50,58 L47,64 L52,64" stroke="#00000033" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="${mouthPath}" stroke="#7d4a42" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="${hairPath}" fill="${hair}"/>
  </svg>`.replace(/\n\s*/g, '');
}

/* ---------------- routing ---------------- */
function go(v, id) {
  VIEW = v;
  if (id) SEL = id;
  document.querySelectorAll('main').forEach(m => m.classList.remove('on'));
  $('#nv').classList.toggle('on', v === 'village');
  $('#nd').classList.toggle('on', v === 'dash');
  if (v === 'village') { $('#vView').classList.add('on'); drawVillage(); drawFeed(); }
  if (v === 'convo')   { $('#cView').classList.add('on'); drawConvo(); }
  if (v === 'dash')    { $('#dView').classList.add('on'); drawDash(); }
}

/* ---------------- data ---------------- */
async function refresh() {
  const [s, f] = await Promise.all([
    (await fetch('/api/state')).json(),
    (await fetch('/api/feed')).json(),
  ]);
  AGENTS = s.agents; FEED = f.events;
  $('#fRemain').textContent = f.remaining + ' events left';
  $('#vCount').textContent = AGENTS.length + ' souls';
  $('#dCount').textContent = AGENTS.length;
}

async function boot() {
  const st = await (await fetch('/api/status')).json();
  $('#pills').innerHTML =
    `<div class="pill">write <b>${esc(st.reasonModel)}</b></div>
     <div class="pill">read <b>${esc(st.fastModel)}</b></div>
     <div class="pill ${st.embeddings.startsWith('stub') ? 'warn' : ''}">embed <b>${esc(st.embeddings.split(':')[0])}</b></div>
     <div class="pill ${st.xai ? '' : 'warn'}">xai <b>${st.xai ? 'live' : 'cached'}</b></div>`;
  $('#eff').value = st.effort;
  $('#cModel').textContent = st.fastModel;
  await refresh(); go('village');
}

/* ---------------- village ---------------- */
function drawVillage() {
  $('#vGrid').innerHTML = AGENTS.map(a => {
    const learned = a.beliefs.filter(b => b.route !== 'baseline').length;
    return `<div class="card" onclick="go('convo','${a.id}')">
      <div class="badge ${learned ? 'hot' : 'zero'}">${learned ? '+' + learned : '—'}</div>
      ${portrait(a.name, 76)}
      <div class="nm">${esc(a.name)}</div>
      <div class="rl">${esc(a.role)}</div>
      <div class="lo">${esc(a.location)}</div>
    </div>`;
  }).join('');
}

function drawFeed() {
  $('#vFeed').innerHTML = FEED.length ? FEED.map((e, i) => `
    <div class="item ${i === 0 ? 'new' : ''}">
      <div class="when">${new Date(e.at).toLocaleTimeString()}
        <span class="k">${esc(e.kind)}</span></div>
      <div class="tx">${esc(e.text)}</div>
      ${e.summary ? `<div class="sm">${esc(e.summary)}</div>` : ''}
      <div class="kb">reached ${e.knownBy} of ${AGENTS.length}</div>
    </div>`).join('')
    : '<div class="empty">Nothing has happened yet. Advance the day.</div>';
}

$('#tick').onclick = async () => {
  const btn = $('#tick'), trace = $('#vTrace');
  btn.disabled = true; trace.style.display = 'block'; trace.innerHTML = '';
  const status = el('status', 'Waking the world…'); let think = null;
  const t0 = Date.now();
  const timer = setInterval(() => btn.textContent = `Reasoning… ${((Date.now() - t0) / 1000).toFixed(0)}s`, 500);

  function el(c, t) { const d = document.createElement('div'); d.className = c; d.textContent = t; trace.appendChild(d); return d; }

  try {
    const r = await fetch('/api/tick', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ effort: $('#eff').value }),
    });
    await readNdjson(r, m => {
      if (m.type === 'event')  status.textContent = 'Event: ' + m.event.text;
      if (m.type === 'status') status.textContent = m.text;
      if (m.type === 'reasoning') {
        if (!think) think = el('think', '');
        think.textContent += m.text; trace.scrollTop = trace.scrollHeight;
      }
      if (m.type === 'error') el('err', '✕ ' + m.text);
      if (m.type === 'done') {
        const n = (m.applied || []).filter(a => a.knows).length;
        status.textContent = (m.cached ? 'replayed from cache' : `${m.model} · ${(m.ms / 1000).toFixed(1)}s`) +
                             ` · reached ${n} of ${(m.applied || []).length}`;
      }
    });
    await refresh(); drawVillage(); drawFeed();
  } catch (e) { el('err', '✕ ' + e.message); }
  finally { clearInterval(timer); btn.disabled = false; btn.textContent = 'Advance the day ▸'; }
};

async function readNdjson(res, on) {
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const { value, done } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) { if (l.trim()) { try { on(JSON.parse(l)); } catch {} } }
  }
}

async function resetWorld() {
  if (!confirm('Wipe the world? You will need to re-seed from the terminal.')) return;
  await fetch('/api/reset', { method: 'POST' }); await refresh(); go('village');
}

/* ---------------- conversation ---------------- */
function agent() { return AGENTS.find(a => a.id === SEL); }

function drawConvo() {
  const a = agent(); if (!a) return go('village');
  $('#cFace').innerHTML = `${portrait(a.name, 128)}
    <div class="nm">${esc(a.name)}</div><div class="rl">${esc(a.role)}</div>
    <div class="lo">${esc(a.location)}</div>`;
  $('#cPersona').textContent = a.persona || '';
  $('#cLog').innerHTML = '<div class="empty">Ask them what they have heard.</div>';
  LASTHITS = []; drawKnow();
}

function drawKnow() {
  const a = agent(); if (!a) return;
  const used = new Set(LASTHITS);
  $('#cKnowN').textContent = a.beliefs.length + ' beliefs';
  $('#cKnow').innerHTML = a.beliefs.length ? a.beliefs.map(b => `
    <div class="kn ${used.has(b.id) ? 'used' : ''}">
      <div class="tx">${esc(b.content)}</div>
      <div class="tags">
        <span class="tag ${b.route === 'baseline' ? '' : 'route'}">${esc(b.route)}</span>
        <span class="tag">conf ${Number(b.confidence).toFixed(2)}</span>
        ${b.distortion && b.distortion !== 'none' ? `<span class="tag d">${esc(b.distortion)}</span>` : ''}
        ${used.has(b.id) ? '<span class="tag route">used just now</span>' : ''}
      </div>
      ${b.route !== 'baseline' && b.reasoning
        ? `<div class="why"><b>why they know it</b>${esc(b.reasoning)}</div>` : ''}
    </div>`).join('')
    : '<div class="empty">Knows nothing at all.</div>';
}

async function say() {
  const m = $('#cq').value.trim(); const a = agent(); if (!m || !a) return;
  $('#cq').value = '';
  const log = $('#cLog'); if (log.querySelector('.empty')) log.innerHTML = '';
  log.insertAdjacentHTML('beforeend',
    `<div class="msg me"><div class="who">you</div><div class="txt">${esc(m)}</div></div>`);
  const pend = document.createElement('div');
  pend.className = 'msg';
  pend.innerHTML = `<div class="who">${esc(a.name)}</div><div class="txt">…</div>`;
  log.appendChild(pend); log.scrollTop = log.scrollHeight;

  try {
    const r = await (await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ agentId: a.id, message: m }),
    })).json();
    if (r.error) throw new Error(r.error);
    pend.innerHTML = `<div class="who">${esc(a.name)}</div>
      <div class="txt">${esc(r.reply)}</div>
      <div class="meta"><span class="lat">${r.totalMs}ms</span>
        <span>retrieved ${r.hits.length}</span><span>${esc(r.model)}</span></div>`;
    LASTHITS = r.hits.map(h => h.id); drawKnow();
  } catch (e) {
    pend.innerHTML = `<div class="who">${esc(a.name)}</div><div class="txt err">✕ ${esc(e.message)}</div>`;
  }
  log.scrollTop = log.scrollHeight;
}
$('#cq').addEventListener('keydown', e => { if (e.key === 'Enter') say(); });

/* ---------------- dashboard ---------------- */
function drawDash() {
  $('#dList').innerHTML = AGENTS.map(a => `
    <div class="agentrow ${SEL === a.id ? 'sel' : ''}" onclick="pick('${a.id}')">
      ${portrait(a.name, 34)}
      <div><div class="nm">${esc(a.name)}</div><div class="rl">${esc(a.role)}</div></div>
      <div style="margin-left:auto" class="row">
        <span class="tag">${a.beliefs.length}</span>
        <button class="ghost sm" onclick="event.stopPropagation();delAgent('${a.id}')">delete</button>
      </div>
    </div>`).join('');
  drawDetail();
}

function pick(id) { SEL = (SEL === id ? null : id); drawDash(); }

function drawDetail() {
  const a = agent();
  if (!a) return $('#dDetail').innerHTML = '<div class="empty">Select an NPC to manage what they know.</div>';
  $('#dDetail').innerHTML = `
    <div class="head" style="margin:18px 0 11px;padding:0 0 9px">Knowledge — ${esc(a.name)}</div>
    <div class="row" style="margin-bottom:12px">
      <input id="nf" placeholder="Add a fact this NPC knows…" style="flex:1" />
      <button onclick="addFact()">Add</button>
    </div>
    ${a.beliefs.map(b => `
      <div class="kn">
        <div class="tx">${esc(b.content)}</div>
        <div class="tags">
          <span class="tag ${b.route === 'baseline' ? '' : 'route'}">${esc(b.route)}</span>
          <span class="tag">conf ${Number(b.confidence).toFixed(2)}</span>
          ${b.distortion && b.distortion !== 'none' ? `<span class="tag d">${esc(b.distortion)}</span>` : ''}
          <button class="ghost sm" style="margin-left:auto" onclick="delBelief('${b.id}')">remove</button>
        </div>
        ${b.reasoning && b.route !== 'baseline' ? `<div class="why"><b>why</b>${esc(b.reasoning)}</div>` : ''}
      </div>`).join('')}`;
}

async function createAgent() {
  const name = $('#dName').value.trim(); if (!name) return alert('Name required.');
  const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
  await fetch('/api/agents', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      name, role: $('#dRole').value.trim(), location: $('#dLoc').value.trim(),
      persona: $('#dPers').value.trim(), ties: [],
      knows: lines($('#dKnows').value), forbidden: lines($('#dForb').value),
    }),
  });
  ['#dName','#dRole','#dLoc','#dPers','#dKnows','#dForb'].forEach(s => $(s).value = '');
  await refresh(); drawDash();
}

async function delAgent(id) {
  if (!confirm('Delete this NPC and everything they know?')) return;
  await fetch('/api/agents/' + id, { method: 'DELETE' });
  if (SEL === id) SEL = null;
  await refresh(); drawDash();
}

async function addFact() {
  const c = $('#nf').value.trim(); if (!c || !SEL) return;
  await fetch('/api/facts', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ agentId: SEL, content: c }),
  });
  await refresh(); drawDash();
}

async function delBelief(id) {
  await fetch('/api/beliefs/' + id, { method: 'DELETE' });
  await refresh(); drawDash();
}

boot();
</script>
</body>
</html>
