<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Defense Force</title>
  <link rel="stylesheet" href="./src/hub/hub.css" />
  <!-- Three.js for the mission's 3D view (tech/mission-3d.md) — fetched only
       when the view is first switched on; the 2D game never touches it. -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
  <!-- The two scenes share one page. main.js shows exactly one at a time. -->
  <div id="hub-root"><!-- rendered by src/hub/hub.js --></div>
  <!-- The 3D view draws UNDER #game, which becomes a transparent layer for
       the tells and the HUD. Same box, same z-index; page order stacks them. -->
  <canvas id="game3d" width="960" height="540" style="display:none"></canvas>
  <canvas id="game" width="960" height="540" style="display:none"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
