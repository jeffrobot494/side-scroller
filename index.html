<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Defense Force</title>
  <link rel="stylesheet" href="./src/hub/hub.css" />
  <!-- Three.js for the mission's 3D view (tech/mission-3d.md), vendored in
       vendor/three/ (tech/mission-3d-only.md O1). build.mjs reads this map to
       follow bare specifiers into dist/. -->
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <!-- The two scenes share one page. main.js shows exactly one at a time. -->
  <div id="hub-root"><!-- rendered by src/hub/hub.js --></div>
  <!-- The 3D view draws UNDER #game, which becomes a transparent layer for
       the tells and the HUD. Same box, same z-index; page order stacks them. -->
  <canvas id="game3d" width="960" height="540" style="display:none"></canvas>
  <canvas id="game" width="960" height="540" style="display:none"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
