        The text-to-3D provider is determined by your account settings.
      operationId: text3d_generate_from_text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: Text description of the 3D model to generate
      responses:
        '200':
          description: Job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: Job ID to poll for status
                  out_of_credits:
                    type: object
                    description: Present if the user does not have enough credits
        '400':
          description: Invalid request - prompt missing/invalid
        '401':
          description: Authentication required
        '402':
          description: Insufficient credits to complete the request
        '403':
          description: Patron subscription required
        '500':
          description: Internal server error
  /embeddings:
    post:
      tags:
        - Embeddings
      summary: Create embeddings
      description: |
        Generate vector embeddings for the given input text. OpenAI-compatible
        (`POST /v1/embeddings`): `input` may be a single string or an array of strings,
        and the response returns one embedding per input (each `data` item's `index` is the
        0-based position of its input in the request). Billed per input token.

        **Limits (for batching/chunking):**
        - Max **100 inputs** per request (exceeding returns 400).
        - Max **8192 tokens per input** (OpenAI text-embedding-3 models); larger inputs are
          rejected by the provider.
      operationId: embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request to create embeddings
              required:
                - input
              properties:
                model:
                  type: string
                  description: ID of the embedding model to use (e.g. text-embedding-3-small). Defaults to your selected model.
                input:
                  description: Input text to embed, as a string or an array of strings.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                dimensions:
                  type: integer
                  minimum: 1
                  description: Optional number of output dimensions (supported by text-embedding-3 models).
      responses:
        '200':
          description: Embeddings created
          content:
            application/json:
              schema:
                type: object
                description: Embedding response
                required:
                  - object
                  - data
                  - model
                  - usage
                properties:
                  object:
                    type: string
                    description: Always "list".
                  data:
                    type: array
                    description: One embedding object per input, in input order.
                    items:
                      type: object
                      required:
                        - object
                        - index
                        - embedding
                      properties:
                        object:
                          type: string
                          description: Always "embedding".
                        index:
                          type: integer
                          description: Index of this embedding in the input array.
                        embedding:
                          type: array
                          description: The embedding vector.
                          items:
                            type: number
                            format: float
                  model:
                    type: string
                    description: The model that produced the embeddings.
                  usage:
                    type: object
                    required:
                      - prompt_tokens
                      - total_tokens
                    properties:
                      prompt_tokens:
                        type: integer
                        description: Number of tokens in the input.
                      total_tokens:
                        type: integer
                        description: Total tokens billed.
        '400':
          description: Invalid request - input missing/invalid or too many inputs.
        '401':
          description: The user must be authenticated.
        '402':
          description: Insufficient credits to complete the request.
        '500':
          description: Internal server error
