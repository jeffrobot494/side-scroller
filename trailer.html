<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trailer</title>
  <!-- The capture page for the trailer (tech/trailer.md). Linked from nothing;
       driven by trailer.mjs. The virtual clock must run before any module. -->
  <script src="./src/trailer/clock.js"></script>
  <link rel="stylesheet" href="./src/hub/hub.css" />
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
  <style>
    html, body { margin: 0; background: #000; overflow: hidden; }
    #game3d { position: absolute; left: 0; top: 0; display: block; }
    /* The HUD, bars, rings and carets: drawn, never shown or captured. */
    #game { display: none; }
    /* Shown only for the hub takes (T4). */
    body:not(.hub-take) #hub-root { display: none; }
    body.hub-take #game3d { display: none; }
    /* The card layer (T6) is captured alone, on nothing. */
    html:has(body.cards-take), body.cards-take { background: transparent !important; }
    body.cards-take::after, body.cards-take #game3d, body.cards-take #game, body.cards-take #hub-root { display: none; }
  </style>
</head>
<body>
  <div id="hub-root"></div>
  <canvas id="game3d"></canvas>
  <canvas id="game" width="960" height="540"></canvas>
  <script type="module" src="./src/trailer/app.js"></script>
</body>
</html>
